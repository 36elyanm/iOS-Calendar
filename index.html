<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f2f2f7;
        }

        .ios-red { color: #ff3b30; }
        .ios-red-bg { background-color: #ff3b30; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .today-circle {
            background-color: #ff3b30;
            color: white !important;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selected-day::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background-color: #8e8e93;
            border-radius: 50%;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid #d1d1d6;
        }

        .event-item {
            border-left: 4px solid #ff3b30;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- Status Bar Spacer (Simulated) -->
    <div class="h-10 bg-white"></div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-10 px-4 py-2">
        <div class="flex justify-between items-center mb-1">
            <button id="prevMonth" class="ios-red text-lg font-medium p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="Wait 15" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 id="currentMonthYear" class="text-xl font-semibold tracking-tight text-black">September 2023</h1>
            <button id="nextMonth" class="ios-red text-lg font-medium p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
        
        <div class="calendar-grid text-center py-2">
            <div class="text-[10px] font-bold text-gray-400 uppercase">S</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">M</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">T</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">W</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">T</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">F</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">S</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-white no-scrollbar">
        <!-- Calendar Grid -->
        <div id="calendarGrid" class="calendar-grid border-b border-gray-200 pb-4">
            <!-- Days injected by JS -->
        </div>

        <!-- Schedule Section -->
        <div class="p-4 bg-[#f2f2f7] min-h-full">
            <div class="flex justify-between items-center mb-4">
                <h2 id="selectedDateLabel" class="text-sm font-bold text-gray-500 uppercase tracking-wider">Tuesday, Sep 12</h2>
                <button class="ios-red p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>

            <!-- Empty State / Schedule -->
            <div id="scheduleContainer" class="space-y-3">
                <div class="bg-white p-4 rounded-xl shadow-sm event-item">
                    <p class="text-xs font-bold text-gray-400 uppercase">09:00 AM</p>
                    <p class="text-lg font-semibold text-gray-900">Morning Sync</p>
                    <p class="text-sm text-gray-500">Design Studio</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-xs font-bold text-gray-400 uppercase">01:30 PM</p>
                    <p class="text-lg font-semibold text-gray-900">Project Review</p>
                    <p class="text-sm text-gray-500">Meeting Room 4</p>
                </div>
                <div class="text-center py-10 text-gray-400 italic hidden" id="noEvents">
                    No events scheduled
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Navigation -->
    <footer class="glass-header flex justify-around items-center py-3 px-6 pb-8">
        <button id="goToday" class="flex flex-col items-center ios-red">
            <span class="text-[10px] font-bold uppercase mt-1">Today</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span class="text-[10px] font-bold uppercase mt-1">Calendars</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span class="text-[10px] font-bold uppercase mt-1">Inbox</span>
        </button>
    </footer>

    <script>
        const calendarGrid = document.getElementById('calendarGrid');
        const monthYearLabel = document.getElementById('currentMonthYear');
        const selectedDateLabel = document.getElementById('selectedDateLabel');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');
        const todayBtn = document.getElementById('goToday');

        let currentDate = new Date();
        let displayDate = new Date(); // Date currently being viewed
        let selectedDate = new Date();

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();
            
            // Set Month Title
            const monthName = displayDate.toLocaleString('default', { month: 'long' });
            monthYearLabel.textContent = `${monthName} ${year}`;

            // First day of month
            const firstDay = new Date(year, month, 1).getDay();
            // Days in month
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            // Days in prev month
            const prevMonthDays = new Date(year, month, 0).getDate();

            // Fill empty slots from previous month
            for (let i = firstDay; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-cell text-gray-300';
                dayDiv.textContent = prevMonthDays - i + 1;
                calendarGrid.appendChild(dayDiv);
            }

            // Current month days
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-cell text-gray-900';
                
                const isToday = i === currentDate.getDate() && 
                                month === currentDate.getMonth() && 
                                year === currentDate.getFullYear();
                
                const isSelected = i === selectedDate.getDate() &&
                                   month === selectedDate.getMonth() &&
                                   year === selectedDate.getFullYear();

                if (isToday) {
                    const circle = document.createElement('div');
                    circle.className = 'today-circle';
                    circle.textContent = i;
                    dayDiv.appendChild(circle);
                } else {
                    dayDiv.textContent = i;
                    if (isSelected) dayDiv.classList.add('selected-day');
                }

                dayDiv.addEventListener('click', () => selectDate(year, month, i));
                calendarGrid.appendChild(dayDiv);
            }

            // Fill next month slots to complete grid
            const totalCells = 42; // 6 rows of 7
            const currentCells = firstDay + daysInMonth;
            for (let i = 1; i <= (totalCells - currentCells); i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-cell text-gray-300';
                dayDiv.textContent = i;
                calendarGrid.appendChild(dayDiv);
            }
            
            updateDateLabel();
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar();
            
            // Visual feedback - simulate loading events
            const container = document.getElementById('scheduleContainer');
            container.style.opacity = '0.5';
            setTimeout(() => {
                container.style.opacity = '1';
                // Randomize schedule visibility for demo
                const noEvents = document.getElementById('noEvents');
                if (day % 3 === 0) {
                    noEvents.classList.remove('hidden');
                    container.querySelectorAll('.bg-white').forEach(el => el.classList.add('hidden'));
                } else {
                    noEvents.classList.add('hidden');
                    container.querySelectorAll('.bg-white').forEach(el => el.classList.remove('hidden'));
                }
            }, 150);
        }

        function updateDateLabel() {
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            selectedDateLabel.textContent = selectedDate.toLocaleDateString('en-US', options);
        }

        prevBtn.onclick = () => {
            displayDate.setMonth(displayDate.getMonth() - 1);
            renderCalendar();
        };

        nextBtn.onclick = () => {
            displayDate.setMonth(displayDate.getMonth() + 1);
            renderCalendar();
        };

        todayBtn.onclick = () => {
            displayDate = new Date();
            selectedDate = new Date();
            renderCalendar();
        };

        // Initialize
        window.onload = renderCalendar;
    </script>
</body>
</html>
